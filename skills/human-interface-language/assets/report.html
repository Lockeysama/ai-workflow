<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root{--bg:#eef1f5;--paper:#fff;--ink:#243044;--muted:#586579;--line:#d8e0eb;--accent:#245bb3;--good:#236849;--warn:#875600;--danger:#ab303b}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    a{color:var(--accent);text-underline-offset:.2em;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}
    button,summary,a,[tabindex]{outline-offset:4px}:focus-visible{outline:3px solid var(--accent)}
    main{max-width:1360px;margin:auto;padding:32px 32px 48px;overflow-wrap:anywhere}
    .document-header{max-width:1120px;margin:0 auto 24px;padding:0 0 24px;border-bottom:1px solid #cdd7e4}
    .eyebrow{color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.12em;margin:0 0 8px}
    h1{font-size:clamp(1.7rem,3vw,2.25rem);line-height:1.3;letter-spacing:-.025em;font-weight:780;color:#17263d;margin:0 0 10px}
    h2{font-size:1.25rem;line-height:1.45;font-weight:760;letter-spacing:-.01em;margin:0}h3{font-size:1rem;line-height:1.5;font-weight:700;color:#30445f;margin:0 0 8px}
    p{margin:0 0 12px}.lead{max-width:42em;font-size:1rem;margin-bottom:10px}.meta,.muted{color:var(--muted);font-size:.83rem}.meta{margin:0}
    .document-layout{display:block;min-width:0}.document-body{min-width:0;max-width:1120px;margin:0 auto}
    .toc{position:fixed;z-index:20;right:24px;bottom:84px;width:196px;max-height:calc(100vh - 108px);max-width:calc(100vw - 48px);overflow-y:auto;font-size:.875rem;padding:12px;background:rgba(255,255,255,.96);border:1px solid #cbd7e6;border-radius:12px;box-shadow:0 8px 28px #24304418;backdrop-filter:blur(10px);transition:opacity .16s ease,transform .16s ease}
    .toc>strong{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.1em;padding:0 12px 12px}.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}.toc li{margin:0}.toc a{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:8px;color:var(--muted);text-decoration:none}.toc a span{flex:0 0 1.8em;white-space:nowrap;font-size:.75rem;font-variant-numeric:tabular-nums;color:#718099}.toc a:hover{background:#e4eaf2;color:var(--ink)}.toc a[aria-current="location"]{background:#fff;border-color:#d4dfed;color:var(--accent);font-weight:650;box-shadow:0 2px 4px #23344806}.toc-note{border-top:1px solid var(--line);margin:20px 12px 0;padding-top:14px;font-size:.78rem;color:var(--muted)}
    .toc>strong{padding-right:12px}.toc.is-collapsed{display:none}.toc-fab{position:fixed;z-index:21;right:24px;bottom:24px;width:46px;height:46px;padding:0;border:1px solid #cbd7e6;border-radius:50%;background:rgba(255,255,255,.97);box-shadow:0 8px 24px #24304420;color:var(--accent);font-size:1.05rem;cursor:pointer}.toc-fab:hover{border-color:var(--accent);transform:translateY(-1px)}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 14px}.mode-switch-wrap{display:flex;align-items:center;gap:6px}.mode-switch{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:190px;padding:3px;border:1px solid #bdcde3;border-radius:10px;background:#e8eef8;isolation:isolate}.mode-switch-thumb{position:absolute;z-index:-1;inset:3px auto 3px 3px;width:calc(50% - 3px);border-radius:7px;background:#fff;box-shadow:0 2px 6px #24304418;transition:transform .2s ease}.mode-switch[data-active="long"] .mode-switch-thumb{transform:translateX(100%)}.mode-switch button{position:relative;z-index:1;border:0;background:transparent;color:var(--muted);padding:7px 12px;min-height:34px;font-size:.8rem}.mode-switch button[aria-checked="true"]{color:var(--accent);font-weight:750}.mode-switch button:focus-visible{z-index:2}.mode-recommendation{white-space:nowrap;color:var(--muted);font-size:.72rem}
    .hil-tabs{margin:0 0 24px}.hil-tab-controls{display:grid;gap:12px;margin:0 0 16px}.hil-tablist{display:flex;flex-wrap:wrap;gap:6px;padding:3px;border-bottom:1px solid var(--line)}.hil-tablist [role="tab"]{flex:0 0 auto;border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:10px 14px;min-height:42px;cursor:pointer}.hil-tablist [role="tab"]:hover{background:#edf2f9;color:var(--ink)}.hil-tablist [role="tab"][aria-selected="true"]{border-bottom-color:var(--accent);background:#edf3ff;color:var(--accent);font-weight:650}.hil-tab-actions{display:none}.hil-tabs.is-ready [role="tabpanel"][hidden]{display:none}.hil-tabs.is-expanded .hil-tab-controls,.hil-tabs.is-expanded>[role="tablist"]{display:none}.hil-tabs .section-panel:last-child{margin-bottom:0}
    .mode-switch[data-options="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.mode-switch[data-options="2"] .mode-switch-thumb{width:calc(50% - 3px)}
    button{font:inherit;font-size:.8rem;border:1px solid #cdd7e4;border-radius:7px;padding:6px 12px;min-height:34px;background:var(--paper);color:var(--ink);cursor:pointer}button:hover{border-color:var(--accent)}
    .section-panel{margin:0 0 24px;min-width:0;border:1px solid #cbd7e6;border-top:4px solid #abc3e8;background:var(--paper);border-radius:14px;box-shadow:0 6px 18px #2430440a;scroll-margin-top:24px}
    .section-head{display:flex;align-items:flex-start;gap:14px;padding:18px 24px;background:linear-gradient(110deg,#edf4ff,#f8fafd 72%);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:.85rem}.section-index{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid #b7cdf0;border-radius:9px;background:#e3eeff;color:var(--accent);font-size:.8rem;font-weight:750;font-variant-numeric:tabular-nums}
    .section-body{padding:24px}.section-body>:last-child{margin-bottom:0}.section-body>p{max-width:42em}.takeaway{font-size:1.12rem;font-weight:600;line-height:1.65;margin:0 0 20px;max-width:42em}.prose{max-width:42em}strong{font-weight:700}li+li{margin-top:.35em}
    .decision-summary{display:grid;grid-template-columns:1fr;margin:0 0 22px;padding:8px 18px;border:1px solid #b8cdea;border-radius:11px;background:#fff}.decision-summary-item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:start;min-width:0;padding:12px 0;border-bottom:1px solid #d9e4f2}.decision-summary-item:last-child{border-bottom:0}.decision-summary-item strong{display:inline-block;justify-self:start;padding:4px 8px;border-radius:6px;background:#e9f0fc;color:var(--accent);font-size:.8rem;font-weight:760}.decision-summary-item[data-decision-role="boundary"] strong{background:#fff0d4}.decision-summary-item[data-decision-role="next"] strong{background:#e7f2ec}.decision-summary-item p{margin:2px 0 0;font-size:.92rem;line-height:1.7;color:var(--ink)}.decision-summary-item[data-decision-role="boundary"] strong{color:var(--warn)}.decision-summary-item[data-decision-role="next"] strong{color:var(--good)}
    .document-overview{margin:0 0 28px;padding:20px 24px;border:1px solid #cbd7e6;border-radius:14px;background:linear-gradient(135deg,#f8fbff,#fff);box-shadow:0 3px 12px #24304404}.document-overview .overview-kicker{margin:0 0 6px;color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.1em}.document-overview h2{margin:0 0 8px}.document-overview .overview-lead{max-width:48em;margin:0 0 16px;font-size:1.03rem;font-weight:600}.overview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.overview-grid>*{min-width:0;padding:12px 14px;border-left:2px solid #c6d8f2;background:#f8fafd;border-radius:0 8px 8px 0}.overview-grid h3{font-size:.86rem;margin:0 0 4px}.overview-grid p{margin:0;font-size:.87rem;line-height:1.6}
    .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.split>*{min-width:0}.inset{background:#f4f6fa;border-radius:9px;padding:16px 18px;border:1px solid #e4e9f0}.inset p:last-child{margin-bottom:0}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}.card{background:#fff;border:1px solid #e0e7f0;border-radius:9px;padding:16px;min-width:0}.card p{font-size:.92rem}.card p:last-child{margin-bottom:0}
    .label{display:inline-block;font-size:.73rem;font-weight:650;color:var(--accent);background:#e9f0fc;border-radius:5px;padding:2px 7px;margin-bottom:9px}.keyword,.term{display:inline;padding:1px 5px;border-radius:4px;background:#fff1b8;color:#5f4600;font-weight:650;box-decoration-break:clone;-webkit-box-decoration-break:clone}.keyword{border-bottom:2px solid #d4a72c}.term{background:#e8f1ff;color:#24508f;border-bottom:1px solid #8db2e3}mark{padding:1px 4px;border-radius:4px;background:#fff1b8;color:#5f4600;font-weight:650;box-decoration-break:clone;-webkit-box-decoration-break:clone}.good{--accent:var(--good)}.warn{--accent:var(--warn)}.danger{--accent:var(--danger)}.good .label{background:#e7f2ec}.warn .label{background:#fff0d4}.danger .label{background:#fbe8eb}
    .callout{border-left:3px solid var(--accent);background:#f3f6fb;padding:14px 18px;margin:20px 0;border-radius:0 8px 8px 0;font-size:.92rem}.callout.warn{background:#fff8e9}.callout.danger{background:#fff1f3}.callout.good{background:#eef7f1}.callout>strong{color:var(--accent)}.callout p{margin:4px 0 0}
    .rule-list{margin:16px 0;display:grid}.rule-row{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:20px;padding:14px 0;border-bottom:1px solid #e6ebf2}.rule-row:first-child{padding-top:0}.rule-row:last-child{border-bottom:0;padding-bottom:0}.rule-row dt{min-width:0;max-width:7rem;color:#435c7b;font-weight:650}.rule-row dd{min-width:0;max-width:42em;margin:0;color:var(--ink);line-height:1.8}.rule-row dd>:last-child{margin-bottom:0}
    /* Share the label width within each group; older browsers keep aligned fixed columns. */
    @supports(grid-template-columns:subgrid){@media(min-width:601px){
      .rule-list{grid-template-columns:minmax(0,max-content) minmax(0,1fr);column-gap:20px}
      .rule-list>.rule-row{grid-column:1 / -1;grid-template-columns:subgrid}
    }}
    /* Native list markers preserve numbering, including ol[start] and li[value]. */
    .step-list{list-style-type:decimal-leading-zero;margin:20px 0;padding-left:2.75rem}.step-list>li{margin:0 0 16px;padding:0 0 16px .35rem;border-bottom:1px solid #e6ebf2}.step-list>li:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}.step-list>li::marker{color:var(--accent);font-size:.9rem;font-weight:650;font-variant-numeric:tabular-nums}.step-list>li>strong{color:#30445f;font-weight:650}.step-list>li>p{max-width:42em;margin:.4rem 0 0}
    .subsection{min-width:0;margin-top:28px;scroll-margin-top:24px}.subsection:first-child{margin-top:0}.subsection+.subsection{padding-top:24px;border-top:1px solid var(--line)}.subsection>h3{font-size:1.12rem;margin-bottom:12px}.subsection>p{max-width:42em}.subsection>:last-child{margin-bottom:0}
    details{border:1px solid #d5dfec;border-radius:10px;background:#f7f9fc;margin:18px 0 0;padding:0 16px;box-shadow:0 2px 8px #24304408}summary{cursor:pointer;font-weight:650;font-size:.9rem;padding:13px 0;color:#30445f;list-style-position:outside}summary::marker{color:var(--accent)}details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:14px;color:var(--accent)}details>:last-child:not(summary){margin-bottom:16px}
    .table-scroll,.diagram-canvas{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper)}table{width:100%;border-collapse:collapse;font-size:.9rem;text-align:left}caption{text-align:left;padding:12px 14px;color:var(--muted);font-size:.8rem}th,td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;min-width:7rem}th{background:#f0f4f9;font-weight:650}tbody th{background:#f8fafd}
    figure{margin:0 0 20px}figcaption{font-size:.9rem;font-weight:500;margin-bottom:12px;color:var(--muted)}.diagram-status{color:var(--muted);font-size:.83rem}.diagram-canvas{padding:18px;background:#fafbfd}.diagram-canvas svg{display:block;min-width:32rem;max-width:100%;height:auto;margin:auto}
    pre{font:.82rem/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-x:auto;background:#eef2f7;padding:14px;border-radius:7px;white-space:pre;max-width:100%;margin:12px 0}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    /* Screen only: printing shows collapsed evidence instead (see @media print). */
    @media screen{details:not([open])>:not(summary){display:none}}
    /* Structural fallbacks also serve intentionally continuous prose. */
    .document-body>h2,.document-body>section:not(.section-panel)>h2{margin:32px 0 14px}
    .document-body>p,.document-body>section:not(.section-panel)>p{max-width:42em}
    .option-detail+.option-detail{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
    .option-detail{scroll-margin-top:24px}.option-detail>p{max-width:42em}
    /* Chinese body copy is capped in em (about 42 CJK characters); English uses a character measure. Keep new components in both lists. */
    :lang(en) .prose,:lang(en) .takeaway,:lang(en) .lead,:lang(en) .rule-row dd,:lang(en) .step-list>li>p,:lang(en) .subsection>p,:lang(en) .section-body>p,:lang(en) .document-body>p{max-width:72ch}
    @media screen and (min-width:1200px){main:has(.document-layout.is-tab-reading){max-width:1360px;padding-right:32px}}
    footer{max-width:1120px;margin:12px auto 0;border-top:1px solid var(--line);padding-top:16px;font-size:.8rem;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:900px){main{padding:24px 18px 36px}.document-body{max-width:none}.toc{right:14px;bottom:74px;max-height:calc(100vh - 88px)}.toc-fab{right:14px;bottom:14px}.section-panel{scroll-margin-top:16px}}
    @media(max-width:600px){body{font-size:16px}.document-header{margin-bottom:16px;padding-bottom:18px}.section-head{padding:16px;gap:10px}.section-head p{font-size:.82rem}.section-head h2{font-size:1.13rem}.section-index{height:30px;flex-basis:30px}.cards,.split,.overview-grid{grid-template-columns:minmax(0,1fr)}.split{gap:18px}.rule-row{grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 0}.rule-row dt{max-width:none}.step-list{padding-left:2.25rem}.subsection{margin-top:24px}.subsection+.subsection{padding-top:20px}.takeaway{font-size:1.04rem}.card{padding:14px}.callout{padding:12px 14px}.document-overview{padding:18px 16px}.decision-summary{padding:6px 14px}.decision-summary-item{grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0}.toolbar{justify-content:flex-start}.mode-switch{min-width:0;width:100%;max-width:300px}.hil-tablist [role="tab"]{padding-inline:12px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    /* Start with usable navigation in normal flow, including when scripts fail to start. */
    .toc:not([data-enhanced="true"]){position:static;width:auto;max-width:1120px;max-height:none;margin:0 auto 24px}
    .hil-tabs:not(.is-ready) .hil-tab-controls,.hil-tabs:not(.is-ready)>[role="tablist"]{display:none}
    /* Print: every chapter on paper, controls off it, collapsed details open. Diagram source stays visible until its SVG rendered. */
    @media print{
      .toolbar,.toc-fab,.hil-tablist{display:none!important}
      /* The scroll-positioned TOC is an overlay once its scripted collapse ran; the no-script list stays in flow and prints. */
      .toc[data-enhanced="true"]{display:none!important}
      .hil-tabs .section-panel:last-child{margin-bottom:0}
      [role="tabpanel"][hidden]{display:block!important}
      details::details-content{content-visibility:visible}
      .diagram[data-rendered="true"] .diagram-source,.diagram[data-rendered="true"] .diagram-status{display:none!important}
      .section-panel{box-shadow:none}
      .section-head,.subsection,.step-list>li,tr,pre,figure,.callout,.decision-summary-item{break-inside:avoid}
      .table-scroll,.diagram-canvas{overflow:visible}
      main{max-width:none;padding:0}
    }
  </style>
</head>
<body>
<main>
  <header class="document-header">
    <p class="eyebrow">{{CATEGORY}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{SUMMARY}}</p>
    <p class="meta">{{META}}</p>
  </header>
  <div class="document-layout">
  <!-- Use nav.toc for long documents; remove for short documents. -->
  {{TOC}}
  <div class="document-body">
  <div class="toolbar" aria-label="阅读操作" hidden>
    <div class="mode-switch-wrap">
      <div class="mode-switch" role="radiogroup" aria-label="阅读模式" data-active="tab">
        <span class="mode-switch-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-action="tab-mode" data-mode="tab" data-mode-control aria-checked="true">Tab 模式</button>
        <button type="button" role="radio" data-action="long-mode" data-mode="long" data-mode-control aria-checked="false">长文模式</button>
      </div>
      <span class="mode-recommendation" data-mode-recommendation hidden></span>
    </div>
    <button type="button" data-action="expand" data-detail-control hidden>展开全部细节</button>
    <button type="button" data-action="collapse" data-detail-control hidden>收起全部细节</button>
    <button type="button" data-action="copy">复制当前内容</button>
  </div>
  {{CONTENT}}
  </div>
  </div>
  <footer>{{FOOTER}}</footer>
</main>
<script>
(() => {
  const tabGroups = [];
  let setTocMode = () => {};
  const layout = document.querySelector('.document-layout');
  let currentMode = 'long';
  const setTabMode = expanded => {
    tabGroups.forEach(item => {
      item.group.classList.toggle('is-ready', !expanded);
      item.group.classList.toggle('is-expanded', expanded);
      if (expanded) item.panels.forEach(panel => { panel.hidden = false; });
      else item.activate(item.index, false);
    });
  };
  const setReadingMode = mode => {
    if (mode === 'tab' && !tabGroups.length) mode = 'long';
    currentMode = mode;
    const longMode = mode === 'long';
    layout?.classList.toggle('is-long-reading', longMode);
    layout?.classList.toggle('is-tab-reading', mode === 'tab');
    document.querySelectorAll('details').forEach(item => item.open = longMode);
    setTabMode(longMode);
    setTocMode(longMode);
    const switcher = document.querySelector('.mode-switch');
    switcher?.setAttribute('data-active', mode);
    switcher?.querySelectorAll('[role="radio"]').forEach(button => {
      button.setAttribute('aria-checked', String(button.dataset.mode === mode));
    });
    const copyButton = document.querySelector('[data-action="copy"]');
    if (copyButton) copyButton.textContent = '复制当前内容';
  };
  const fallbackCopy = text => {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.top = '0';
    area.style.left = '-9999px';
    area.style.width = '1px';
    area.style.height = '1px';
    document.body.appendChild(area);
    area.focus({preventScroll:true});
    area.select();
    area.setSelectionRange(0, area.value.length);
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    area.remove();
    return copied;
  };
  const copyCurrentView = async () => {
    const body = document.querySelector('.document-body');
    if (!body) return;
    body.querySelectorAll('*').forEach((node, index) => node.setAttribute('data-hil-copy-key', String(index)));
    const clone = body.cloneNode(true);
    if (!clone) return;
    clone.querySelectorAll('.toolbar,[hidden]').forEach(node => node.remove());
    clone.querySelectorAll('details:not([open]) > *:not(summary)').forEach(node => node.remove());
    clone.querySelectorAll('*').forEach(node => {
      const source = document.querySelector(`[data-hil-copy-key=\"${node.getAttribute('data-hil-copy-key')}\"]`);
      if (!source) return;
      const computed = getComputedStyle(source);
      node.style.cssText = Array.from(computed).map(name => `${name}:${computed.getPropertyValue(name)};`).join('');
    });
    const text = (clone.innerText || clone.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
    clone.querySelectorAll('[data-hil-copy-key]').forEach(node => node.removeAttribute('data-hil-copy-key'));
    const html = clone.innerHTML;
    let copied = false;
    if (navigator.clipboard?.write && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([text], {type:'text/plain'})})]);
        copied = true;
      } catch {}
    }
    if (!copied && navigator.clipboard?.writeText) {
      try { await navigator.clipboard.writeText(text); copied = true; } catch {}
    }
    if (!copied) copied = fallbackCopy(text);
    const button = document.querySelector('[data-action="copy"]');
    if (!button) return;
    const original = button.textContent;
    button.textContent = copied ? '已复制当前内容' : '复制失败，请手动选择';
    setTimeout(() => { button.textContent = original; }, 1800);
  };
  document.querySelectorAll('[data-hil-tab-prev],[data-hil-tab-next],[data-hil-tab-status]').forEach(node => node.remove());
  document.querySelectorAll('[data-hil-tabs]').forEach(group => {
    const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
    const panels = Array.from(group.querySelectorAll('[role="tabpanel"]'));
    const tablist = group.querySelector('[role="tablist"]');
    if (!tablist || tabs.length < 2 || tabs.length !== panels.length) return;
    const item = {group, tabs, panels, index:0, activate:null};
    const activate = (index, focus) => {
      item.index = (index + tabs.length) % tabs.length;
      tabs.forEach((tab, i) => {
        const active = i === item.index;
        tab.setAttribute('aria-selected', String(active));
        tab.setAttribute('tabindex', active ? '0' : '-1');
        panels[i].hidden = !active;
      });
      if (focus) tabs[item.index].focus();
    };
    item.activate = activate;
    group.classList.add('is-ready');
    activate(0, false);
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activate(index, false));
      tab.addEventListener('keydown', event => {
        let next = null;
        if (event.key === 'ArrowRight') next = index + 1;
        if (event.key === 'ArrowLeft') next = index - 1;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = tabs.length - 1;
        if (next === null) return;
        event.preventDefault();
        activate(next, true);
      });
    });
    let startX = 0, startY = 0;
    group.addEventListener('touchstart', event => {
      if (event.touches.length === 1) {
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }
    }, {passive:true});
    group.addEventListener('touchend', event => {
      if (!startX || event.changedTouches.length !== 1) return;
      const endX = event.changedTouches[0].clientX;
      const endY = event.changedTouches[0].clientY;
      const dx = endX - startX, dy = endY - startY;
      const blocked = event.target.closest('table, pre, code, a, button, input, textarea, select');
      startX = startY = 0;
      if (blocked || Math.abs(dx) < 48 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
      activate(item.index + (dx < 0 ? 1 : -1), false);
    }, {passive:true});
    tabGroups.push(item);
  });
  const toolbar = document.querySelector('.toolbar');
  if (toolbar) {
    toolbar.hidden = false;
    const hasTabs = tabGroups.length > 0;
    const switcher = toolbar.querySelector('.mode-switch');
    switcher?.setAttribute('data-options', '2');
    toolbar.querySelectorAll('[data-detail-control]').forEach(button => button.hidden = true);
    if (!hasTabs) switcher?.setAttribute('hidden', '');
    const recommendation = toolbar.querySelector('[data-mode-recommendation]');
    if (recommendation && hasTabs) { recommendation.hidden = false; recommendation.textContent = tabGroups[0].group.dataset.recommendedMode === 'long' ? '推荐长文' : '推荐 Tab'; }
    const modes = hasTabs ? ['tab', 'long'] : ['long'];
    switcher?.querySelectorAll('[role="radio"]').forEach(button => {
      button.addEventListener('click', () => setReadingMode(button.dataset.mode));
      button.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const index = modes.indexOf(button.dataset.mode);
        const next = event.key === 'ArrowRight' ? index + 1 : index - 1;
        const nextButton = switcher.querySelector(`[data-mode="${modes[(next + modes.length) % modes.length]}"]`);
        nextButton?.focus();
        setReadingMode(nextButton?.dataset.mode || modes[0]);
      });
    });
    toolbar.addEventListener('click', event => {
      const action = event.target.closest('button')?.dataset.action;
      if (action === 'copy') copyCurrentView();
    });
  }
  const toc = document.querySelector('.toc');
  if (toc) {
    toc.dataset.enhanced = 'true';
    if (!toc.id) { let id = 'hil-toc', i = 2; while (document.getElementById(id)) id = 'hil-toc-' + i++; toc.id = id; }
    const fab = document.createElement('button');
    fab.type = 'button'; fab.className = 'toc-fab no-print';
    fab.setAttribute('aria-label', '收起目录'); fab.title = '收起目录'; fab.textContent = '☰';
    fab.setAttribute('aria-controls', toc.id);
    document.body.appendChild(fab);
    const setCollapsed = collapsed => {
      toc.classList.toggle('is-collapsed', collapsed);
      toc.inert = collapsed;
      fab.setAttribute('aria-expanded', String(!collapsed));
      toc.setAttribute('aria-hidden', String(collapsed));
      fab.setAttribute('aria-label', collapsed ? '展开目录' : '收起目录');
      fab.title = collapsed ? '展开目录' : '收起目录';
    };
    fab.addEventListener('click', () => setCollapsed(!toc.classList.contains('is-collapsed')));
    setTocMode = visible => {
      if (tabGroups.length) {
        fab.hidden = !visible;
        setCollapsed(!visible);
      } else {
        fab.hidden = false;
        setCollapsed(false);
      }
      layout?.classList.toggle('is-long-reading', visible && tabGroups.length > 0);
      layout?.classList.toggle('is-tab-reading', !visible && tabGroups.length > 0);
    };
    setCollapsed(tabGroups.length > 0);
    const entries = Array.from(toc.querySelectorAll('a[href^="#"]')).map(link => {
      try { return { link, section:document.getElementById(decodeURIComponent(link.hash.slice(1))) }; }
      catch { return { link, section:null }; }
    }).filter(entry => entry.section);
    const updateLocation = () => {
      let current = entries[0];
      for (const entry of entries) if (entry.section.getBoundingClientRect().top <= 160) current = entry;
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) current = entries.at(-1);
      for (const entry of entries) {
        if (entry === current) entry.link.setAttribute('aria-current', 'location');
        else entry.link.removeAttribute('aria-current');
      }
    };
    let queued = false;
    window.addEventListener('scroll', () => {
      if (!queued) { queued = true; requestAnimationFrame(() => { updateLocation(); queued = false; }); }
    }, { passive:true });
    window.addEventListener('resize', updateLocation);
    updateLocation();
    document.addEventListener('click', event => {
      if (!toc.classList.contains('is-collapsed') && !toc.contains(event.target) && event.target !== fab && !event.target.closest('.mode-switch')) setCollapsed(true);
    });
  }
  const recommendedMode = tabGroups[0]?.group.dataset.recommendedMode;
  setReadingMode(recommendedMode || (tabGroups.length ? 'tab' : 'long'));
  const revealHashTarget = () => {
    let target;
    try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch { return; }
    if (!target) return;
    const tabPanel = target.closest('[role="tabpanel"]');
    if (tabPanel) {
      const owner = tabGroups.find(item => item.panels.includes(tabPanel));
      if (owner) owner.activate(owner.panels.indexOf(tabPanel), false);
    }
    let changed = false;
    for (let node = target; node; node = node.parentElement) {
      if (node.tagName === 'DETAILS' && !node.open) { node.open = true; changed = true; }
    }
    if (changed) target.scrollIntoView();
  };
  window.addEventListener('hashchange', revealHashTarget);
  revealHashTarget();
  // Print opens collapsed details so paper keeps the evidence; the reading state returns afterwards.
  let restoreAfterPrint = null;
  window.addEventListener('beforeprint', () => {
    if (restoreAfterPrint) return;
    const details = Array.from(document.querySelectorAll('details'));
    restoreAfterPrint = { mode: currentMode, open: details.map(item => item.open) };
    details.forEach(item => { item.open = true; });
  });
  window.addEventListener('afterprint', () => {
    if (!restoreAfterPrint) return;
    const { mode, open } = restoreAfterPrint;
    restoreAfterPrint = null;
    if (mode !== currentMode) return;
    document.querySelectorAll('details').forEach((item, index) => { item.open = open[index] ?? item.open; });
  });
  const figures = Array.from(document.querySelectorAll('.diagram'));
  if (!figures.length) return;
  figures.forEach(figure => { const canvas = figure.querySelector('.diagram-canvas'); if (canvas) canvas.tabIndex = 0; });
  const fail = figure => {
    figure.dataset.rendered = 'false';
    const canvas = figure.querySelector('.diagram-canvas');
    if (canvas) { canvas.replaceChildren(); canvas.hidden = true; }
    const status = figure.querySelector('.diagram-status');
    if (status) { status.hidden = false; status.textContent = '图示暂时无法显示，请阅读图示说明；需要时可展开源码。'; }
  };
  async function render() {
    let timer;
    try {
      const module = await Promise.race([
        import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs'),
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Diagram loading timeout')), 12000); })
      ]);
      clearTimeout(timer);
      const mermaid = module.default;
      mermaid.initialize({ startOnLoad:false, securityLevel:'strict', suppressErrorRendering:true, theme:'base', themeVariables:{fontFamily:'-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif',fontSize:'16px',primaryColor:'#edf3ff',primaryTextColor:'#243044',primaryBorderColor:'#7b99c3',lineColor:'#64748b',secondaryColor:'#edf5ef',tertiaryColor:'#f6f7f9'}, flowchart:{htmlLabels:false} });
      for (const [index, figure] of figures.entries()) {
        try {
          const source = figure.querySelector('.diagram-source code').textContent;
          const canvas = figure.querySelector('.diagram-canvas');
          canvas.hidden = false;
          const { svg } = await mermaid.render('readable-diagram-' + index, source, canvas);
          canvas.innerHTML = svg;
          figure.dataset.rendered = 'true';
          figure.querySelector('.diagram-status').hidden = true;
        } catch { fail(figure); }
      }
    } catch { figures.forEach(fail); }
    finally { clearTimeout(timer); }
  }
  render();
})();
</script>
